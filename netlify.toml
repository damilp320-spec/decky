# Список плагинов отдаёт edge-функция netlify/edge-functions/plugins.ts: только
# она может ответить на предварительный запрос OPTIONS, без которого Decky не
# получает список. Обычные функции для этого не годятся — с некоторых сетей
# запрос за ними висит без ответа.

[build]
  publish = "public"
  command = ""

# Короткий адрес для страницы проверки: она лежит на GitHub Pages, чтобы
# запросы к этому сайту шли с другого домена — как из Steam.
[[redirects]]
  from = "/d"
  to = "https://damilp320-spec.github.io/decky/diag.html"
  status = 302
  force = true
