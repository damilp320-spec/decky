<h1>Зеркало магазина плагинов Decky</h1>
<p>Список плагинов отдаётся по адресу <code>/plugins</code> — его и вписывают в
Decky → Settings → General → Store channel → Custom.</p>
<p>Сами архивы лежат на GitHub Pages, здесь работает только прослойка с
CORS-заголовками. Статус зеркала и список плагинов —
<a href="https://damilp320-spec.github.io/decky/">на странице зеркала</a>.</p>
